<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- PLACEHOLDER: Replace with official Ecodite Foundation emblem -->
  <!-- The real logo is a circular emblem with: orange sunburst rays, a purple arc,
       curved magenta text, an open book, and a green human figure rising with leaves -->
  <circle cx="100" cy="100" r="96" fill="#FAF7F0" stroke="#D9DFD0" stroke-width="2"/>
  
  <!-- Simplified sunburst rays (orange) -->
  <g stroke="#EE8B2B" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="20" x2="100" y2="40"/>
    <line x1="140" y1="28" x2="130" y2="45"/>
    <line x1="170" y1="55" x2="155" y2="65"/>
    <line x1="60" y1="28" x2="70" y2="45"/>
    <line x1="30" y1="55" x2="45" y2="65"/>
  </g>
  
  <!-- Simplified book (green) -->
  <g fill="none" stroke="#17402A" stroke-width="2.5" stroke-linecap="round">
    <path d="M75 120 L100 110 L125 120"/>
    <path d="M75 120 L75 95 Q87 90 100 95"/>
    <path d="M125 120 L125 95 Q113 90 100 95"/>
    <line x1="100" y1="95" x2="100" y2="110"/>
  </g>
  
  <!-- Simplified figure (green) -->
  <g fill="#5E9C3F">
    <circle cx="100" cy="75" r="8"/>
    <path d="M95 83 L100 100 L105 83 Z"/>
  </g>
  
  <!-- Leaves -->
  <g fill="#5E9C3F" opacity="0.7">
    <ellipse cx="88" cy="80" rx="4" ry="8" transform="rotate(-30 88 80)"/>
    <ellipse cx="112" cy="80" rx="4" ry="8" transform="rotate(30 112 80)"/>
  </g>
  
  <!-- Arc (purple) -->
  <path d="M45 140 Q100 170 155 140" fill="none" stroke="#7A3B7A" stroke-width="2.5" opacity="0.5"/>
  
  <!-- Placeholder text -->
  <text x="100" y="160" text-anchor="middle" font-size="10" fill="#4A5750" font-family="sans-serif">
    PLACEHOLDER LOGO
  </text>
